name: Record Full Installer Test

on:
  workflow_dispatch:
    inputs:
      play_wait_seconds:
        description: "Seconds to let the video/roast screen run before it auto-closes"
        default: "150"

jobs:
  record:
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout test-runner repo (driver script)
        uses: actions/checkout@v4
        with:
          path: gta-sa-test-runner

      - name: Checkout installer repo (untouched)
        uses: actions/checkout@v4
        with:
          repository: TheLightPhoenix98/gta-sa-definitely-legit
          path: gta-sa-definitely-legit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Switch runner to dark mode
        shell: pwsh
        run: |
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          Set-ItemProperty -Path $key -Name "AppsUseLightTheme" -Value 0
          Set-ItemProperty -Path $key -Name "SystemUsesLightTheme" -Value 0
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Process explorer.exe
          Start-Sleep -Seconds 2

      - name: Set display resolution to 1080p
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public class Resolution {
              [DllImport("user32.dll")]
              public static extern int EnumDisplaySettings(string deviceName, int modeNum, ref DEVMODE devMode);

              [DllImport("user32.dll")]
              public static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);

              [StructLayout(LayoutKind.Sequential)]
              public struct DEVMODE {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                  public string dmDeviceName;
                  public short dmSpecVersion;
                  public short dmDriverVersion;
                  public short dmSize;
                  public short dmDriverExtra;
                  public int dmFields;
                  public int dmPositionX;
                  public int dmPositionY;
                  public int dmDisplayOrientation;
                  public int dmDisplayFixedOutput;
                  public short dmColor;
                  public short dmDuplex;
                  public short dmYResolution;
                  public short dmTTOption;
                  public short dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                  public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel;
                  public int dmPelsWidth;
                  public int dmPelsHeight;
                  public int dmDisplayFlags;
                  public int dmDisplayFrequency;
                  public int dmICMMethod;
                  public int dmICMIntent;
                  public int dmMediaType;
                  public int dmDitherType;
                  public int dmReserved1;
                  public int dmReserved2;
                  public int dmPanningWidth;
                  public int dmPanningHeight;
              }

              public static int SetResolution(int width, int height) {
                  DEVMODE dm = new DEVMODE();
                  dm.dmDeviceName = new string(new char[32]);
                  dm.dmFormName = new string(new char[32]);
                  dm.dmSize = (short)Marshal.SizeOf(dm);

                  if (EnumDisplaySettings(null, -1, ref dm) != 0) {
                      dm.dmPelsWidth = width;
                      dm.dmPelsHeight = height;
                      return ChangeDisplaySettings(ref dm, 0);
                  }
                  return -1;
              }
          }
          '@
          $result = [Resolution]::SetResolution(1920, 1080)
          Write-Host "ChangeDisplaySettings result: $result (0 = success)"
          Start-Sleep -Seconds 2
          Get-CimInstance -ClassName Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gta-sa-definitely-legit/requirements.txt

      - name: Ensure ffmpeg is available
        shell: pwsh
        run: |
          $existing = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($existing) {
            Write-Host "ffmpeg already on PATH at $($existing.Source)"
          } else {
            Write-Host "ffmpeg not found, grabbing a static build from GitHub instead of choco (chocolatey's feed times out sometimes)"
            $zipUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
            Invoke-WebRequest -Uri $zipUrl -OutFile ffmpeg.zip
            Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted
            $binDir = (Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).DirectoryName
            Write-Host "ffmpeg.exe found in $binDir"
            Add-Content -Path $env:GITHUB_PATH -Value $binDir
          }

      - name: Start screen recording
        shell: pwsh
        run: |
          $wait = [int]"${{ github.event.inputs.play_wait_seconds }}"
          $duration = $wait + 40
          Start-Process ffmpeg -ArgumentList "-y -f gdigrab -framerate 15 -i desktop -t $duration -pix_fmt yuv420p -movflags frag_keyframe+empty_moov+default_base_moof demo.mp4"
          Start-Sleep -Seconds 1

      - name: Run full test (wizard, then video + roast)
        shell: pwsh
        env:
          PLAY_WAIT_SECONDS: ${{ github.event.inputs.play_wait_seconds }}
        run: python gta-sa-test-runner/scripts/run_full_test.py

      - name: Stop recording
        shell: pwsh
        run: |
          # the test script has already finished by this point (whether
          # it ran the full duration or exited early/crashed), so there's
          # nothing left worth recording. Stop ffmpeg right away instead
          # of waiting out its own fixed -t timer, which used to leave
          # the recording running well after the game/roast had exited.
          Stop-Process -Name ffmpeg -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2  # give ffmpeg a moment to flush the mp4 file properly

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: full-installer-demo
          path: demo.mp4
